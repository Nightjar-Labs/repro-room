[project]
name = "repro-room"
version = "0.1.0"
description = "Paste a GitHub issue; Repro Room reproduces it in a disposable sandbox at the reported and the latest version."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nightjar Labs" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "packaging>=24.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
repro-room = "reproroom.app:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reproroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: end-to-end against GitHub, PyPI and a real LLM endpoint (deselected by default; run with -m live)",
    "sandbox: starts real containers with the configured runtime",
]
