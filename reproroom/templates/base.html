<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Repro Room · reproduce GitHub issues in a disposable sandbox{% endblock %}</title>
<meta name="description" content="Paste a GitHub issue; Repro Room reproduces it at the reported and latest version in a disposable, offline sandbox.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="10" y="10" width="12" height="12" rx="3" fill="currentColor"/></svg>
      <span class="name">Repro Room</span>
      <span class="by">by Nightjar Labs</span>
    </a>
    <nav>
      <a href="/#how">How it works</a>
      <a href="/#containment">Containment</a>
      <a href="/healthz">Health</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  <span>Repro Room v{{ version }}</span>
  <span>LLM: {{ model }} via {{ llm_host }}</span>
  <span>Sandbox: {{ sandbox.cli }}{% if sandbox.oci_runtime %} + {{ sandbox.oci_runtime }}{% endif %}</span>
  <span>MIT · Nightjar Labs · built for Vultr Agent Rush</span>
</footer>
</body>
</html>
